name: CI for Weather Tracker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/weather-tracker:${{ github.sha }}

      - name: Update Helm Chart Tag
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          
          # שימוש בטוקן לשיבוט ה-GitOps Repo
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/moti-art/weather-gitops.git
          cd weather-gitops/charts/weather-app
          
          # פקודת sed חכמה שמחליפה את ה-tag רק בתוך הבלוק של ה-tracker
          sed -i "/tracker:/,/tag:/ s/tag: .*/tag: \"${{ github.sha }}\"/" values-dev.yaml

          # בדיקה אם בוצע שינוי לפני ה-commit
          if [ -n "$(git status --porcelain)" ]; then
            git add values-dev.yaml
            git commit -m "chore: update tracker tag to ${{ github.sha }}"
            git push
          else
            echo "No changes to commit"
          fi