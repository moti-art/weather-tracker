name: CI for Weather Tracker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/weather-tracker:${{ github.sha }}

      # --- השלב של ה-Senior: עדכון אוטומטי של ה-GitOps ---
      - name: Update Helm Chart Tag
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/<היוזר_שלך>/weather-gitops.git
          cd weather-gitops/charts/weather-app
          # עדכון ה-Tag בקובץ values-dev.yaml באמצעות sed
          sed -i "s/tracker_tag:.*/tracker_tag: \"${{ github.sha }}\"/" values-dev.yaml
          git add values-dev.yaml
          git commit -m "update tracker image tag to ${{ github.sha }}"
          git push